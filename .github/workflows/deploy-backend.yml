name: Deploy backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'cv-bot-backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  validate:
    name: Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-bot-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cv-bot-backend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    name: Deploy to Railway
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-bot-backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
